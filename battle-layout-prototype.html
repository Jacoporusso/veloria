<!doctype html>
<html lang="it">
<head>

<title>Veloria · Studio della lotta</title>
<style>
:root{font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;color:#f3faf9;background:#102e3b;font-synthesis:none;--mint:#a8f5dc;--ink:#183b49;--muted:#b0cbd1}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:3px solid #e5baff;outline-offset:3px}button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}.app{height:100vh;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto auto;overflow:hidden;background:#123640}.arena{position:relative;isolation:isolate;min-height:0;overflow:hidden;background:#304e4c url('./assets/battle/veloria-battle-forest-v1.webp') center/cover}.arena:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#092b43a8,transparent 48%,#0a2d36aa)}.topline{position:absolute;inset:20px 18px auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:14px;letter-spacing:.16em;font-weight:900;text-shadow:0 2px 10px #15302e}.brand b{color:var(--mint);font-size:25px;vertical-align:middle;margin-right:5px}.place{font-size:9px;font-weight:800;letter-spacing:.12em;display:block;color:#d2e4e1;margin-top:2px}.round{font-size:10px;border:1px solid #ffffff30;padding:8px 10px;border-radius:12px;background:#163e4b80;backdrop-filter:blur(12px)}.pokemon{position:absolute;filter:drop-shadow(0 12px 7px #122e4055);object-fit:contain;user-select:none;pointer-events:none}.enemy{width:clamp(120px,36vw,240px);height:42%;right:13%;top:24%}.ally{width:clamp(140px,43vw,280px);height:49%;left:2%;bottom:9%;transform:scaleX(-1)}.ground{position:absolute;width:36%;height:11%;border-radius:50%;background:#e4fae62b;box-shadow:0 0 30px #d4ffe91a;border:1px solid #e7ffdf30;transform:rotate(-7deg)}.ground.foe{right:11%;top:57%}.ground.own{left:3%;bottom:12%;width:43%}.status{position:absolute;width:190px;padding:11px 13px;background:linear-gradient(130deg,#143c49ed,#173b48b5); :absolute;left:18px;top:5px;color:#e8f5ec9c;font-size:8px;letter-spacing:.12em}.modal{border:0;padding:0;width:min(440px,calc(100% - 24px));max-height:calc(100dvh - 32px);border-radius:25px;background:linear-gradient(140deg,#244858,#132b3f);color:white;box-shadow:0 24px 110px #021b32b0;overflow:auto}.modal::backdrop{background:#061d33a8;backdrop-filter:blur(8px)}.detail-header{padding:22px 22px 16px;position:relative;background:radial-gradient(ellipse at top left,var(--surface),transparent 80%);border-bottom:1px solid #b8d9e625}.detail-header .type-icon{width:45px;height:45px;font-size:30px;border-radius:16px;margin-bottom:12px}.detail-header h2{font-size:28px;margin:0;letter-spacing:-.04em}.detail-header p{font-size:12px;margin:7px 0 0;color:#c1d8dd}.close{position:absolute;right:14px;top:14px;width:42px;height:42px;border:1px solid #ffffff25;background:#ffffff0b;color:white;border-radius:14px;font-size:22px}.detail-body{padding:19px 22px 22px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat-cell{background:#ffffff08;padding:12px 7px;border:1px solid #ffffff14;border-radius:14px;text-align:center}.stat-cell small{display:block;color:#acc9d3;font-size:10px;margin-bottom:5px}.stat-cell b{font-size:17px}.effect{padding:16px 0;border-bottom:1px solid #ffffff19}.effect h3,.estimate h3{font-size:11px;letter-spacing:.08em;margin:0 0 9px;color:#b4e8da}.effect p{font-size:14px;line-height:1.6;margin:0}.estimate{margin-top:18px;padding:16px;border-radius:17px;background:linear-gradient(130deg,#98eedc17,#b4a4ff13);border:1px solid #a2edda30}.estimate strong{font-size:26px;letter-spacing:-.04em}.estimate p{font-size:11px;color:#bfd6dc;line-height:1.6;margin:8px 0 0}.detail-action{width:100%;border:0;background:linear-gradient(115deg,#a9efcf,#9fdce9);color:#12394a;padding:15px;border-radius:15px;font-weight:900;font-size:14px;margin-top:19px;min-height:48px}.toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:5;background:#102f45ed;border:1px solid #b7f4dc65;padding:16px 22px;border-radius:18px;box-shadow:0 12px 50px #041d3c66;font-size:14px;font-weight:800;max-width:85%;text-align:center;pointer-events:none}.restore{color:var(--mint);background:none;border:0;padding:8px 0;font-size:12px}.caught-ball{position:absolute;top:40%;right:24%;font-size:55px;animation:ball 1s ease 2}.legend{display:flex;justify-content:center;gap:14px;margin-top:11px;color:#a8c7cf;font-size:9px}.reset-fight{position:absolute;right:18px;bottom:14px;background:#183c4a;border:1px solid #ffffff50;color:white;padding:12px 16px;border-radius:14px;font-weight:800}.progress-fill{height:5px;width:80%;background:linear-gradient(90deg,#b5ffdc,#d4b9ff);border-radius:8px;margin-top:9px}
@keyframes hit{30%,60%{opacity:.25;translate:8px 0}45%,75%{opacity:1;translate:-6px 0}}@keyframes attack{50%{translate:25px -12px}}@keyframes float{0%{opacity:0;translate:0 12px}20%{opacity:1}100%{opacity:0;translate:0 -35px}}@keyframes ball{20%,60%{rotate:-15deg}40%,80%{rotate:15deg}}
@media(min-width:900px) and (min-height:600px){.deck{padding:18px 28px;min-height:0}.moves{grid-template-columns:repeat(4,1fr)}.nav{padding-left:max(18px,calc((100vw - 880px)/2));padding-right:max(18px,calc((100vw - 880px)/2))}.arena .enemy{right:24%;height:46%;top:24%}.arena .ally{left:18%;height:56%;bottom:6%}.status.foe{right:15%;top:75px}.status.own{left:15%;bottom:24px}.event{right:18%;bottom:30px}.ground.foe{right:21%;width:24%}.ground.own{left:15%;width:30%}}
@media(orientation:landscape) and (max-height:599px){.app{grid-template-columns:minmax(0,1fr) minmax(330px,44%);grid-template-rows:minmax(0,1fr) auto}.arena{grid-row:1}.deck{grid-column:2;grid-row:1;padding:14px 14px 8px;min-height:0;display:flex;flex-direction:column;justify-content:center;border-top:0;border-left:1px solid #ffffff20}.moves{width:100%;gap:8px}.move-main{height:91px}.nav{grid-column:1/-1;grid-row:2;min-height:62px;padding-top:3px;padding-bottom:max(4px,env(safe-area-inset-bottom))}.nav button{min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px}.nav button span{font-size:21px}.topline{inset:14px 12px auto}.brand{font-size:11px}.brand b{font-size:20px}.place{font-size:7px}.round{font-size:9px;padding:6px}.prototype-mark{top:3px;left:12px;font-size:6px}.status{width:149px;padding:8px 10px;border-radius:14px}.status.foe{top:53px;right:12px}.status.own{bottom:10px;left:12px}.name-row{font-size:13px}.type-row{margin:2px 0 6px;font-size:9px}.enemy{right:12%;top:23%;height:51%;width:35%}.ally{left:3%;bottom:17%;height:61%;width:44%}.ground.foe{top:64%}.ground.own{bottom:17%}.event{font-size:10px;bottom:17px;right:12px;max-width:46%}.subpanel{width:100%}.subpanel h2{font-size:14px}.option{min-height:65px;padding:10px}.option b{font-size:12px}.note{font-size:10px;line-height:1.4;margin-top:9px}.legend{font-size:8px;gap:10px}.modal{max-height:calc(100dvh - 18px)}.detail-header{padding:16px 20px}.detail-header .type-icon{display:none}.detail-header h2{font-size:24px}.detail-body{padding:14px 20px}.stat-cell{padding:8px}.effect{padding:12px 0}.effect p{font-size:12px}.estimate{margin-top:12px;padding:12px}.detail-action{margin-top:12px}}
@media(max-width:359px){.deck{padding:10px;min-height:223px}.move-name{font-size:13px}.move-main{padding:10px;height:87px}.move-top{gap:5px}.move-bottom{font-size:9px}.type-icon{width:25px;height:25px;font-size:19px}.match{font-size:9px}.legend{gap:9px}.status{width:166px}.status.foe{top:63px}.info{right:0;width:31px}}
@media(orientation:portrait) and (max-height:650px){.status{width:152px;padding:8px 10px;border-radius:14px}.status .name-row{font-size:13px}.status .type-row{display:none}.status .health{margin-top:7px}.status.foe{top:65px;right:12px}.status.own{left:12px;bottom:30px}.enemy{top:29%;right:5%;height:50%}.ally{bottom:17%;height:53%}.event{bottom:8px;left:12px;right:12px;max-width:none;font-size:10px;text-align:center}.place{font-size:8px}.level{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" aria-label="Prototipo interattivo di una lotta Veloria">
 <section class="arena" aria-label="Campo di battaglia">
  <header class="topline"><div class="brand"><b>Ⅴ</b>VELORIA<span class="place">BOSCO DEI VELI · INCONTRO SELVATICO</span></div><span class="round" id="round">Turno 1</span></header>
  <small class="prototype-mark">STUDIO INTERATTIVO · PARTITA DIMOSTRATIVA</small>
  <div class="ground foe"></div><div class="ground own"></div>
  <img class="pokemon enemy" id="enemy" src="./assets/creatures/pokeapi-route-43-v1.webp" alt="Oddish selvatico">
  <img class="pokemon ally" id="ally" src="./assets/creatures/pokeapi-starter-4-v1.webp" alt="Il tuo Charmander">
  <div class="status foe"><div class="name-row">Oddish <span class="level">Lv. 12 ♂</span></div><div class="type-row"><span>🌿</span> Erba <span>☠️</span> Veleno</div><div class="health"><i id="enemy-hp" style="width:100%"></i></div><div class="hp"><span id="enemy-health">40 / 40 HP</span><span>SELVATICO</span></div></div>
  <div class="status own"><div class="name-row">Charmander <span class="level">Lv. 14 ♀</span></div><div class="type-row"><span>🔥</span> Fuoco <span class="party-dots" aria-label="Tre Pokémon disponibili">●●●</span></div><div class="health"><i id="own-hp" style="width:85%"></i></div><div class="hp"><span id="own-health">39 / 46 HP</span><span>LA TUA SQUADRA</span></div></div>
  <div class="event" id="event" role="status" aria-live="polite">È apparso un Oddish selvatico!</div>
  <button class="reset-fight" id="reset" hidden>↻ Nuova lotta demo</button>
 </section>
 <section class="deck" id="deck" aria-label="Comandi disponibili"></section>
 <nav class="nav" role="tablist" aria-label="Azioni di lotta">
  <button role="tab" aria-selected="true" aria-controls="deck" data-tab="fight"><span aria-hidden="true">⚔️</span>Lotta</button>
  <button role="tab" aria-selected="false" aria-controls="deck" data-tab="bag"><span aria-hidden="true">🎒</span>Borsa</button>
  <button role="tab" aria-selected="false" aria-controls="deck" data-tab="capture"><span aria-hidden="true">◉</span>Cattura</button>
  <button role="tab" aria-selected="false" aria-controls="deck" data-tab="team"><span aria-hidden="true">🐾</span>Squadra</button>
  <button role="tab" aria-selected="false" aria-controls="deck" data-tab="run"><span aria-hidden="true">💨</span>Fuga</button>
 </nav>
</main>
<dialog class="modal" id="detail" aria-labelledby="detail-name"></dialog>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<script>
// Isolated presentation fixture: no imports from the game, save access or API calls.
const moves=[
 {id:'ember',name:'Braciere',icon:'🔥',type:'Fuoco',category:'✦ Speciale',power:40,accuracy:100,pp:25,max:25,style:'fire',match:'↑ Super · ×2',effect:'Infligge danni speciali. Ha il 10% di probabilità di scottare: la scottatura causa danni a fine turno e riduce i danni fisici inflitti.',estimate:'18–24 HP',reason:'Contro Oddish · super efficace ×2. Charmander è di tipo Fuoco: bonus di tipo incluso.',damage:21},
 {id:'scratch',name:'Graffio',icon:'💥',type:'Normale',category:'✴ Fisica',power:40,accuracy:100,pp:35,max:35,style:'normal',match:'● Normale · ×1',effect:'Infligge danni fisici. Il tuo Attacco si confronta con la Difesa di Oddish. Nessun effetto aggiuntivo.',estimate:'7–10 HP',reason:'Contro Oddish · danno normale ×1. Nessun bonus di tipo.',damage:8},
 {id:'growl',name:'Ruggito',icon:'🔊',type:'Normale',category:'◇ Supporto',power:null,accuracy:100,pp:40,max:40,style:'support',match:'↓ Attacco avv.',effect:'Riduce l’Attacco avversario di un grado. I danni fisici di Oddish diminuiscono. La modifica dura finché resta in campo, fino al limite di −6 gradi.',estimate:'Nessun danno diretto',reason:'Mossa di supporto: modifica una statistica, senza usare i moltiplicatori di danno.',damage:0},
 {id:'smokescreen',name:'Muro di Fumo',icon:'🌫️',type:'Normale',category:'◇ Supporto',power:null,accuracy:100,pp:20,max:20,style:'support',match:'↓ Precisione avv.',effect:'Riduce la Precisione avversaria di un grado: le sue mosse possono mancare più spesso. La modifica dura finché resta in campo, fino al limite di −6 gradi.',estimate:'Nessun danno diretto',reason:'Mossa di supporto: modifica una statistica, senza infliggere danni.',damage:0}
];
let enemyHp=40,ownHp=39,turn=1,activeTab='fight',busy=false,ended=false,potions=3,balls=5;
let toastTimer;
const $=s=>document.querySelector(s);
const notify=text=>{clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,1800)};
function render(){
 document.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===activeTab));b.disabled=busy||ended});
 if(activeTab==='fight')$('#deck').innerHTML=`<div class="moves">${moves.map(m=>`<article class="move ${m.style}"><button class="move-main" data-move="${m.id}" ${busy||ended||m.pp===0?'disabled':''} aria-label="Usa ${m.name}, ${m.type}, ${m.match}, ${m.pp} PP"><span class="move-top"><span class="type-icon" aria-hidden="true">${m.icon}</span><span class="move-name">${m.name}<small class="category">${m.category} <span class="match">${m.id==='ember'?'↑ ×2':m.id==='scratch'?'● ×1':''}</span></small></span></span><span class="move-bottom"><span>${m.power?'💥 '+m.power:'◇ —'}</span><span>🎯 ${m.accuracy}%</span><span title="Punti potenza">${m.pp}/${m.max} PP</span></span></button><button class="info" data-detail="${m.id}" aria-label="Dettagli ${m.name}">ⓘ</button></article>`).join('')}</div><div class="legend"><span>💥 Potenza</span><span>🎯 Precisione</span><span>PP Utilizzi</span><span>ⓘ Dettagli mossa</span></div>`;
 if(activeTab==='bag')$('#deck').innerHTML=`<div class="subpanel"><h2>🎒 Scegli uno strumento</h2><div class="options"><button class="option" data-action="potion" ${potions===0?'disabled':''}><span class="emoji">🧪</span><span><b>Pozione <small>×${potions} · recupera 20 HP</small></b></span></button><button class="option" data-action="antidote"><span class="emoji">💊</span><span><b>Antidoto<small>×2 · cura il veleno</small></b></span></button></div><p class="note">Gli strumenti si scelgono qui. La lotta resta visibile.</p></div>`;
 if(activeTab==='capture')$('#deck').innerHTML=`<div class="subpanel"><h2>◉ Porta Oddish con te</h2><div class="options"><button class="option" data-action="ball" ${balls===0?'disabled':''}><span class="emoji">🔴</span><span><b>Poké Ball<small>×${balls} · lancia una sfera</small></b></span></button><button class="option" data-action="greatball"><span class="emoji">🔵</span><span><b>Mega Ball<small>×2 · cattura facilitata</small></b></span></button></div><p class="note">💡 Ridurre gli HP o causare uno stato aiuta la cattura.</p></div>`;
 if(activeTab==='team')$('#deck').innerHTML=`<div class="subpanel"><h2>🐾 Chi scende in campo?</h2><div class="options"><button class="option" data-action="current"><span class="emoji">🔥</span><span><b>Charmander · Lv. 14<small>${ownHp}/46 HP · in campo</small></b></span></button><button class="option" data-action="switch"><span class="emoji">🐦</span><span><b>Pidgey · Lv. 12<small>36/36 HP · pronto</small></b></span></button></div><p class="note">Tocco sul Pokémon per scegliere il cambio.</p></div>`;
 if(activeTab==='run')$('#deck').innerHTML=`<div class="subpanel"><h2>💨 Torniamo all’esplorazione?</h2><div class="options"><button class="option" data-action="escape"><span class="emoji">🍃</span><span><b>Prova a fuggire<small>Lascia questo incontro</small></b></span></button><button class="option" data-action="stay"><span class="emoji">⚔️</span><span><b>Resta in lotta<small>Torna alle mosse</small></b></span></button></div><p class="note">Le azioni in questa pagina sono dimostrative.</p></div>`;
}
function details(id){const m=moves.find(m=>m.id===id);$('#detail').className='modal '+m.style;$('#detail').innerHTML=`<header class="detail-header"><span class="type-icon" aria-hidden="true">${m.icon}</span><h2 id="detail-name">${m.name}</h2><p>${m.type} · ${m.category} · ${m.match}</p><button class="close" aria-label="Chiudi dettagli">×</button></header><div class="detail-body"><div class="stat-grid"><div class="stat-cell"><small>💥 Potenza</small><b>${m.power??'—'}</b></div><div class="stat-cell"><small>🎯 Precisione</small><b>${m.accuracy}%</b></div><div class="stat-cell"><small>Utilizzi · PP</small><b>${m.pp}/${m.max}</b></div></div><section class="effect"><h3>COSA FA</h3><p>${m.effect}</p></section><section class="estimate"><h3>STIMA DANNO · CONTRO ODDISH</h3><strong>${m.estimate}</strong><p>${m.reason} ${m.damage?'Intervallo illustrativo del mockup: un colpo critico o altre modifiche possono cambiare l’esito.':''}</p></section><button class="detail-action" data-use="${id}" ${busy||ended||m.pp===0?'disabled':''}>${m.icon} Usa ${m.name}</button></div>`;$('#detail').showModal();}
function updateHealth(){ $('#enemy-hp').style.width=enemyHp/40*100+'%';$('#enemy-health').textContent=enemyHp+' / 40 HP';$('#own-hp').style.width=ownHp/46*100+'%';$('#own-health').textContent=ownHp+' / 46 HP';$('#round').textContent='Turno '+turn; }
function finish(text){ended=true;$('#event').textContent=text;$('#reset').hidden=false;render();}
async function useMove(id){if(busy||ended)return;const m=moves.find(m=>m.id===id);if(!m.pp)return;m.pp--;busy=true;render();$('#event').textContent=`Charmander usa ${m.name}!`;$('#ally').classList.add('attack');await pause(500);$('#ally').classList.remove('attack');if(m.damage){enemyHp=Math.max(0,enemyHp-m.damage);$('#enemy').classList.add('hit');const float=document.createElement('div');float.className='floating';float.textContent=`−${m.damage}${id==='ember'?' · Super!':''}`;$('.arena').append(float);setTimeout(()=>float.remove(),1500);updateHealth();}else notify(m.match.replace('avv.','di Oddish')+' · −1 grado');await pause(750);$('#enemy').classList.remove('hit');if(!enemyHp){busy=false;finish('✨ Oddish è esausto. Hai vinto!');return;}ownHp=Math.max(1,ownHp-(id==='growl'?2:4));turn++;updateHealth();$('#event').textContent=`Oddish risponde! Charmander perde ${id==='growl'?2:4} HP.`;busy=false;render();}
const pause=ms=>new Promise(r=>setTimeout(r,ms));
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){activeTab=b.dataset.tab;render();}if(b.dataset.detail)details(b.dataset.detail);if(b.matches('.close'))$('#detail').close();if(b.dataset.use){$('#detail').close();useMove(b.dataset.use);}if(b.dataset.move)useMove(b.dataset.move);if(b.id==='reset'){enemyHp=40;ownHp=39;turn=1;ended=false;busy=false;potions=3;balls=5;moves.forEach(m=>m.pp=m.max);$('#enemy').style.opacity=1;$('#enemy').style.visibility='';$('#reset').hidden=true;$('#event').textContent='È apparso un Oddish selvatico!';activeTab='fight';updateHealth();render();}const a=b.dataset.action;if(!a||busy||ended)return;if(a==='potion'){potions--;ownHp=Math.min(46,ownHp+20);updateHealth();notify('🧪 Charmander recupera HP');render();}if(a==='antidote')notify('Charmander non è avvelenato.');if(a==='current')notify('Charmander è già in campo.');if(a==='switch')notify('🐦 Cambio selezionato · anteprima del comando');if(a==='stay'){activeTab='fight';render();}if(a==='escape')finish('🍃 Fuga riuscita. Il viaggio continua.');if(a==='ball'||a==='greatball'){balls=Math.max(0,balls-1);busy=true;render();$('#event').textContent='La sfera oscilla…';$('#enemy').style.opacity='.15';const ball=document.createElement('div');ball.className='caught-ball';ball.textContent='🔴';$('.arena').append(ball);await pause(2000);ball.remove();$('#enemy').style.visibility='hidden';busy=false;finish('✨ Preso! Oddish si unisce alle tue scoperte.');}});
$('#detail').addEventListener('click',e=>{if(e.target===$('#detail')){const r=$('#detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#detail').close();}});
document.querySelector('.nav').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const tabs=[...document.querySelectorAll('[data-tab]')];const i=tabs.indexOf(document.activeElement);const next=tabs[(i+(e.key==='ArrowRight'?1:4))%5];next.focus();next.click();});
render();
</script>
</body>
</html>
