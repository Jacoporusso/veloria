<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#183b48" />
    <meta name="description" content="Esplora Borgofonte, il primo villaggio della regione di Veloria." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/veloria-180.png" />
    <title>Veloria — Atlante delle meraviglie</title>
  </head>
  <body>
    <main class="game-shell" aria-label="Veloria, gioco di esplorazione">
      <header class="game-header">
        <div class="brand" aria-label="Veloria, Atlante delle meraviglie"><svg class="brand-mark" viewBox="0 0 34 38" fill="none" aria-hidden="true"><defs><linearGradient id="veloria-brand" x2="30" y2="38" gradientUnits="userSpaceOnUse"><stop stop-color="#afffe3"/><stop offset=".5" stop-color="#79cfff"/><stop offset="1" stop-color="#c6b1ff"/></linearGradient></defs><path d="M3 6l12 27a2 2 0 004 0L31 6" stroke="url(#veloria-brand)" stroke-width="5" stroke-linecap="round"/><path d="M17 1l2.4 5.6L25 9l-5.6 2.4L17 17l-2.4-5.6L9 9l5.6-2.4Z" fill="white"/></svg><span>VELORIA<small>ATLANTE DELLE MERAVIGLIE</small></span></div>
        <div class="location"><span class="location-dot"></span><span id="current-location">BORGOFONTE</span></div>
        <div class="header-actions"><button class="sound-button update-button" id="update-button" aria-label="Aggiorna Veloria" hidden>↻</button><button class="sound-button" id="menu-button" aria-label="Apri menu di gioco" aria-expanded="false" aria-controls="exploration-menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 16h14"/></svg></button></div>
        <nav class="exploration-menu" id="exploration-menu" aria-label="Menu di gioco" hidden>
          <div class="atlas-intro"><span>ATLANTE DI VELORIA</span><h2>Ogni scoperta<br>è una nuova storia.</h2><p>Luoghi, incontri e compagni da portare con te.</p></div>
          <button id="region-map-button" aria-label="Apri la mappa di Veloria"><span aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2V5Zm6-2v16m6-14v16"/></svg></span>Mappa di Veloria</button>
          <button id="journey-button"><span aria-hidden="true">✦</span>Diario del viaggio</button>
          <button id="bag-button"><span aria-hidden="true">◉</span>Zaino e dotazioni</button>
          <button id="team-button" aria-label="Apri la squadra"><span aria-hidden="true">♧</span>Squadra</button>
          <button id="training-button" aria-label="Apri allenamenti della Lega"><span aria-hidden="true">⚔</span>Allenamenti della Lega</button>
          <button id="badges-button" aria-label="Apri le medaglie"><span aria-hidden="true">◇</span>Medaglie</button>
          <button id="pokedex-button" aria-label="Apri il Pokédex"><span aria-hidden="true">◈</span>Pokédex</button>
          <button id="settings-button" aria-label="Impostazioni accessibilità e audio"><span aria-hidden="true">☷</span>Impostazioni</button>
          <button id="backup-button" aria-label="Apri importazione ed esportazione salvataggio"><span aria-hidden="true">↥</span>Salvataggi e backup</button>
          <button id="title-button"><span aria-hidden="true">⌂</span>Salva e torna al titolo</button>
          <button id="help-button" aria-label="Mostra i comandi"><span aria-hidden="true">?</span>Come si gioca</button>
        </nav>
        <section class="save-menu" id="save-menu" aria-label="Gestione salvataggio" hidden>
          <button type="button" id="export-save">Esporta backup JSON</button>
          <button type="button" id="import-save">Importa backup JSON</button>
          <input id="save-file" type="file" accept="application/json,.json" hidden />
        </section>
        <section class="settings-menu" id="settings-menu" aria-label="Impostazioni" hidden>
          <button type="button" id="trainer-appearance-button">✦ Aspetto allenatore</button>
          <label for="movement-control">Movimento touch</label>
          <select id="movement-control"><option value="buttons">Frecce</option><option value="joystick">Trackpad a trascinamento</option></select>
          <label for="animation-quality">Qualità animazioni</label>
          <select id="animation-quality">
            <option value="full">Complete</option>
            <option value="reduced">Ridotte</option>
          </select>
          <label for="text-speed">Velocità testo</label>
          <select id="text-speed">
            <option value="slow">Lenta</option>
            <option value="normal" selected>Normale</option>
            <option value="fast">Veloce</option>
          </select>
          <label for="music-volume">Volume musica</label>
          <input id="music-volume" type="range" min="0" max="100" step="1" aria-label="Volume della musica" />
          <button type="button" id="audio-toggle" aria-pressed="false">Attiva audio</button>
        </section>
      </header>
      <section class="game-stage" aria-label="Area di gioco">
        <div class="game-loading" id="game-loading" role="status" aria-live="polite"><span class="loading-mark" aria-hidden="true">✳</span><span>Prepariamo la tua avventura…</span></div>
        <div id="game" aria-label="Mappa interattiva di Borgofonte"></div>
        <section class="pokedex-panel" id="pokedex-panel" role="dialog" aria-modal="true" aria-labelledby="pokedex-title" hidden>
          <header class="pokedex-header">
            <div><span class="pokedex-kicker">REGISTRO DEL VIAGGIO</span><h2 id="pokedex-title">Pokédex</h2></div>
            <button class="pokedex-close" id="pokedex-close" type="button" aria-label="Chiudi il Pokédex">×</button>
          </header>
          <p class="pokedex-summary" id="pokedex-summary" aria-live="polite"></p>
          <ol class="pokedex-list" id="pokedex-list" aria-label="Specie registrate"></ol>
        </section>
        <button class="interaction-prompt" id="interaction-prompt" hidden></button>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <section class="dialogue-box" id="dialogue-box" aria-live="polite" aria-label="Dialogo" hidden>
          <div class="dialogue-speaker" id="dialogue-speaker"></div>
          <p class="dialogue-text" id="dialogue-text"></p>
          <div class="starter-choices" id="starter-choices" hidden aria-label="Scegli il tuo compagno iniziale"></div>
          <div class="dialogue-footer"><span>STORIA DI VELORIA</span><span id="dialogue-prompt">A · Continua ▸</span></div>
        </section>
      </section>
      <footer class="game-footer">
        <div class="dpad" aria-label="Comandi di movimento touch">
          <button class="dpad-key up" data-direction="up" aria-label="Vai in alto">▲</button>
          <button class="dpad-key left" data-direction="left" aria-label="Vai a sinistra">◀</button>
          <button class="dpad-key down" data-direction="down" aria-label="Vai in basso">▼</button>
          <button class="dpad-key right" data-direction="right" aria-label="Vai a destra">▶</button>
        </div>
        <button type="button" class="movement-stick" aria-label="Trackpad di movimento: trascina per camminare" hidden><span class="movement-stick-ring" aria-hidden="true"></span><span class="movement-stick-thumb" aria-hidden="true"></span></button>
        <div class="touch-actions" aria-label="Azioni touch">
          <button class="action-button" id="action-a" aria-label="Conferma e interagisci">A</button>
          <button class="action-button action-secondary" id="action-b" aria-label="Annulla">B</button>
          <button class="action-button action-save" id="action-save" aria-label="Salva la partita">S</button>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
