name: Verify

on:
  push:
    branches: [main]
    # Deployment receipts do not change the game or its verification inputs.
    paths-ignore: [docs/CI_STATUS.md]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Let a running integration suite finish while the latest revision waits.
  cancel-in-progress: false

jobs:
  verify:
    name: Browser ${{ matrix.suite }} shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        # Isolate the measured DPR3 canvas journeys and the championship. Run
        # 39419114192 exhausted a 24-minute chapter shard after 20 passing cases.
        include:
          - {suite: chapters, shard: 1, total: 12}
          - {suite: chapters, shard: 2, total: 12}
          - {suite: chapters, shard: 3, total: 12}
          - {suite: chapters, shard: 4, total: 12}
          - {suite: chapters, shard: 5, total: 12}
          - {suite: chapters, shard: 6, total: 12}
          - {suite: chapters, shard: 7, total: 12}
          - {suite: chapters, shard: 8, total: 12}
          - {suite: chapters, shard: 9, total: 12}
          - {suite: chapters, shard: 10, total: 12}
          - {suite: chapters, shard: 11, total: 12}
          - {suite: chapters, shard: 12, total: 12}
          # Run 40471009557 exhausted the browser step after 19 passing world
          # path cases. Keep their full journeys and the same time limits.
          - {suite: world, shard: 1, total: 4}
          - {suite: world, shard: 2, total: 4}
          - {suite: world, shard: 3, total: 4}
          - {suite: world, shard: 4, total: 4}
          - {suite: journeys, shard: 1, total: 4}
          - {suite: journeys, shard: 2, total: 4}
          - {suite: journeys, shard: 3, total: 4}
          - {suite: journeys, shard: 4, total: 4}
          - {suite: mvp, shard: 1, total: 4}
          - {suite: mvp, shard: 2, total: 4}
          - {suite: mvp, shard: 3, total: 4}
          - {suite: mvp, shard: 4, total: 4}
          - {suite: controls, shard: 1, total: 2}
          - {suite: controls, shard: 2, total: 2}
          - {suite: league, shard: 1, total: 1}
          # Run40947076372 exhausted24 minutes after26 passing chapter cases.
          # The complete R16/services journey took7.5 minutes on that runner.
          # Keep its assertions/timeouts and optional battles in one own job.
          - {suite: league-approach, shard: 1, total: 1}
    runs-on: ubuntu-latest
    # Runner bootstrap can take over 20 minutes; preserve the separately
    # bounded 24-minute browser step plus artifact upload after that setup.
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build and type-check
        id: build
        run: npm run build

      - name: Run domain and persistence tests
        run: npm test

      - name: Validate content, maps, assets, and dependency licenses
        run: python tools/validate_examples.py

      - name: Run Python validator tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Audit browser suite coverage
        if: matrix.suite == 'chapters' && matrix.shard == 1
        run: node tools/check_browser_suite_coverage.mjs

      - name: Run browser end-to-end tests
        timeout-minutes: 24
        env:
          VELORIA_E2E_SUITE: ${{ matrix.suite }}
        run: npm run test:e2e -- --workers=1 --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Preserve browser screenshots and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.suite }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            test-results-e2e-offline/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  offline:
    name: Offline ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: journey
            filter: --grep=E2E-06
          # Run 40829505097 reached the 20-minute step limit after 30
          # passing resource cases. Split the complete suite four ways.
          - suite: resources-1
            filter: --grep-invert=E2E-06 --shard=1/4
          - suite: resources-2
            filter: --grep-invert=E2E-06 --shard=2/4
          - suite: resources-3
            filter: --grep-invert=E2E-06 --shard=3/4
          - suite: resources-4
            filter: --grep-invert=E2E-06 --shard=4/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify offline shard coverage
        if: matrix.suite == 'resources-1'
        run: node tools/check_offline_shard_coverage.mjs
      - name: Test complete cached adventure
        timeout-minutes: 20
        run: npm run test:e2e:offline -- --workers=1 ${{ matrix.filter }}
      - name: Preserve offline diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-diagnostics-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results-e2e-offline/
          if-no-files-found: ignore
          retention-days: 7
