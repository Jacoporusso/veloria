name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Let a running integration suite finish while the latest revision waits.
  cancel-in-progress: false

jobs:
  verify:
    name: Browser shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build and type-check
        id: build
        run: npm run build

      - name: Run domain and persistence tests
        run: npm test

      - name: Validate content, maps, assets, and dependency licenses
        run: python tools/validate_examples.py

      - name: Run Python validator tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run browser end-to-end tests
        timeout-minutes: 16
        run: npm run test:e2e -- --workers=1 --shard=${{ matrix.shard }}/3

      - name: Preserve browser screenshots and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            test-results-e2e-offline/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  offline:
    name: Offline adventure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test complete cached adventure
        timeout-minutes: 15
        run: npm run test:e2e:offline -- --workers=1
      - name: Preserve offline diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results-e2e-offline/
          if-no-files-found: ignore
          retention-days: 7
